<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#255b4d"><meta name="description" content="属于你的轻量工作台。离线记录任务，通过 GitHub 在设备间同步。"><title>我的工作台</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"><script src="./app.js" type="module"></script></head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="./"><span class="brand-icon">▦</span><span>我的工作台</span></a>
    
    <nav aria-label="任务分类">
      <button class="nav-item active" data-view="all"><span class="nav-icon">▤</span>全部任务<span class="count" id="count-all">0</span></button>
      <button class="nav-item" data-view="today"><span class="nav-icon">◷</span>今日待办<span class="count" id="count-today">0</span></button>
      <button class="nav-item" data-view="upcoming"><span class="nav-icon">▦</span>即将到来<span class="count" id="count-upcoming">0</span></button>
      <button class="nav-item" data-view="completed"><span class="nav-icon">✓</span>已完成<span class="count" id="count-completed">0</span></button>
    </nav>
    <div class="sidebar-bottom"><button id="settings-button" class="settings-button"><span>⚙</span>同步与设置</button></div>
  </aside>
  <main>
    <header class="topbar"><span class="breadcrumb">个人空间 <span>/</span> <strong id="breadcrumb-view">全部任务</strong></span><div class="topbar-right"><span id="network-status" class="network-status">在线</span><button id="sync-button" class="button sync-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5.4 8a7 7 0 0 1 11.7-2L20 9M4 15l2.9 3A7 7 0 0 0 18.6 16"/></svg><span>同步</span></button><span class="avatar" aria-label="个人工作空间">我</span></div></header>
    <section class="workspace">
      <div class="page-heading"><div><h1 id="page-title">全部任务</h1></div><button id="new-task" class="button primary"><span class="plus">＋</span>新建任务</button></div>
      <section class="stats" aria-label="任务概览"><div class="stat-card"><span>待办任务</span><strong id="stat-pending">0</strong><span class="stat-decoration">▤</span></div><div class="stat-card"><span>今日待办</span><strong id="stat-today">0</strong><span class="stat-decoration">◷</span></div><div class="stat-card completion-card"><span>已完成</span><strong id="stat-completed">0</strong><span class="completion-ring" id="completion-ring"><span>✓</span></span></div></section>
      <section class="task-panel" aria-label="任务列表">
        <div class="panel-heading"><div><h2 id="list-title">全部任务</h2><span id="result-count" class="result-count">0 项待办</span></div><div class="list-tools"><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="search" type="search" placeholder="搜索任务或备注" aria-label="搜索任务或备注"></label><select id="sort" aria-label="任务排序"><option value="smart">截止日期优先</option><option value="newest">最近更新优先</option></select></div></div>
        <div class="filter-row" aria-label="优先级筛选"><button data-priority="all" class="filter-chip active">所有优先级</button><button data-priority="high" class="filter-chip"><span class="priority-dot high"></span>高优先级</button><button data-priority="normal" class="filter-chip"><span class="priority-dot normal"></span>普通</button><button data-priority="low" class="filter-chip"><span class="priority-dot low"></span>低优先级</button></div>
        <form id="quick-add" class="quick-add"><span>＋</span><input id="quick-title" maxlength="200" placeholder="添加任务，按回车保存" aria-label="快速新增任务" autocomplete="off"><button type="submit">添加</button></form>
        <div id="task-list" class="task-list"></div>
        <div id="empty-state" class="empty-state"><div class="empty-art"><svg viewBox="0 0 120 100" aria-hidden="true"><rect x="27" y="12" width="66" height="78" rx="10"/><path d="M43 37h34M43 52h24M43 67h17"/><circle cx="87" cy="76" r="19"/><path d="m79 76 6 6 11-13"/></svg></div><h3 id="empty-title">暂无任务</h3><p id="empty-description"></p><button class="button subtle" id="empty-add">新建任务</button></div>
        <footer class="panel-footer"><span id="save-status">正在读取本地数据…</span><span id="sync-status">尚未配置同步</span></footer>
      </section>
      
    </section>
  </main>
</div>
<dialog id="task-dialog" aria-labelledby="task-dialog-title"><form id="task-form"><div class="dialog-heading"><div><h2 id="task-dialog-title">新建任务</h2></div><button type="button" class="icon-button" data-close="task-dialog" aria-label="关闭">×</button></div><label>任务名称<input id="task-title" required maxlength="200" placeholder="准备做些什么？"></label><label>备注<textarea id="task-notes" maxlength="10000" rows="4" placeholder="补充想法、步骤或相关信息"></textarea></label><div class="form-row"><label>截止日期<input id="task-due" type="date"></label><label>优先级<select id="task-priority"><option value="normal">普通</option><option value="high">高优先级</option><option value="low">低优先级</option></select></label></div><div class="dialog-actions"><button type="button" class="button" data-close="task-dialog">取消</button><button class="button primary" type="submit">保存任务</button></div></form></dialog>
<dialog id="settings-dialog" aria-labelledby="settings-title"><div class="dialog-heading"><div><h2 id="settings-title">同步与设置</h2></div><button class="icon-button" data-close="settings-dialog" aria-label="关闭">×</button></div><div class="settings-intro"><span class="github-mark">⌘</span><div><strong>GitHub 私有仓库同步</strong></div></div><form id="settings-form"><label>数据仓库<input id="repo-input" required value="solen-w/personal-workbench-data" placeholder="用户名/仓库名" autocomplete="off"></label><label>专用访问令牌<input id="token-input" type="password" placeholder="输入你已创建的细粒度令牌" autocomplete="off" spellcheck="false"></label><p class="field-help">令牌仅本次会话使用，刷新后需重新输入。</p><div class="settings-actions"><button class="button primary" type="submit">保存设置</button><button id="forget-token" class="button" type="button">清除当前令牌</button></div></form><div class="settings-section"><h3>本地数据备份</h3><p>导入会合并任务，不覆盖本地数据。</p><div class="settings-actions"><button id="export-button" class="button">导出 JSON</button><button id="import-button" class="button">导入 JSON</button><input type="file" id="import-file" accept=".json,application/json" hidden></div></div><div class="settings-section"><h3>离线使用</h3><p id="offline-info">首次在线打开后缓存应用页面；离线能否重新启动，还需要当前浏览器完成缓存。本地数据不会随普通刷新清空，清除网站数据则会删除本地副本。</p><button id="install-button" class="button" hidden>添加到桌面</button></div><p id="settings-message" role="status" class="settings-message"></p></dialog>
<dialog id="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title">删除这条任务？</h2><p>删除会在下次同步时传递到其他设备。现在可以先取消。</p><div class="dialog-actions"><button id="cancel-delete" class="button">取消</button><button id="confirm-delete" class="button danger">删除任务</button></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body></html>
